<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>笔记本黑屏放电复位速查 - 0xc.in</title>
<meta name="theme-color" content="#1a1f2e">
<meta name="description" content="笔记本按电源键只有风扇转、屏幕不亮？按品牌查放电与复位方法。不拆机、不刷 BIOS、不需要 U 盘。">
<style>
:root{
  --accent:#B33A22;
  --warn:#8A6D1F;
  --ok:#137a53;
  --bg:#f3f6f8;
  --card:#ffffff;
  --fg:#23272e;
  --fg-soft:#5b6470;
  --fg-dim:#8a929c;
  --line:#e6eaee;
  --line-soft:#f0f3f5;
  --tint-ok:#e9f7f1;
  --tint-warn:#fdf3e3;
  --tint-danger:#fdeeeb;
  --tint-note:#f2f5f8;
  --key-bg:#ffffff;
  --key-line:#c9d0d8;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --accent:#ff7a5c;
    --warn:#d8b25c;
    --ok:#4fcfa0;
    --bg:#14171c;
    --card:#1c2027;
    --fg:#e6e9ee;
    --fg-soft:#a8b0bb;
    --fg-dim:#79828e;
    --line:#2c323b;
    --line-soft:#242932;
    --tint-ok:#16302a;
    --tint-warn:#332a16;
    --tint-danger:#38211d;
    --tint-note:#232831;
    --key-bg:#252b34;
    --key-line:#3d444f;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);line-height:1.7;font-size:15px;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}

/* ---------- header ---------- */
.hero{background:linear-gradient(135deg,#1a1f2e 0%,#30333c 100%);color:#fff;padding:22px 14px 18px}
.hero-in{max-width:760px;margin:0 auto}
.hero h1{font-size:21px;font-weight:700;letter-spacing:.5px}
.hero .scope{font-size:12.5px;color:#a9b2c0;margin-top:5px}
.hero .home{font-size:12px;color:#8b94a3;text-decoration:none;float:right}

/* ---------- search ---------- */
.searchwrap{position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 14px 8px;
  box-shadow:0 2px 10px rgba(0,0,0,.05)}
.searchwrap .in{max-width:760px;margin:0 auto}
.sbox{position:relative;display:flex;align-items:center}
.sbox svg{position:absolute;left:11px;width:16px;height:16px;opacity:.45;pointer-events:none}
#q{width:100%;padding:11px 36px 11px 34px;font-size:16px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--fg);outline:none;font-family:inherit}
#q:focus{border-color:var(--accent)}
#clearBtn{position:absolute;right:6px;border:0;background:transparent;color:var(--fg-dim);
  font-size:20px;line-height:1;padding:4px 8px;cursor:pointer;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--fg-soft);
  border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- generic blocks ---------- */
section{margin-top:16px}
.sec-title{font-size:13px;font-weight:700;color:var(--fg-dim);letter-spacing:1px;
  margin:0 2px 8px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card + .card{margin-top:10px}

/* myth */
.myth{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:12px 14px;margin-top:14px}
.myth b{color:var(--accent);font-size:14px}
.myth p{font-size:13.5px;color:var(--fg-soft);margin-top:3px}

/* triage */
.tri{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px}
.tri + .tri{margin-top:8px}
.tri .sym{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.tri .sym .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:9px}
.tri .act{font-size:13.5px;color:var(--accent);font-weight:600;margin:4px 0 0 17px}
.tri .det{font-size:13px;color:var(--fg-soft);margin:2px 0 0 17px}
.tri.oos{background:var(--tint-note);border-style:dashed}
.tri.oos .dot{background:var(--fg-dim)}
.tri.oos .act{color:var(--fg-dim)}
.tri.oos .act::before{content:"⛔ ";}

/* procedure */
.proc{padding:14px}
.proc + .proc{border-top:1px solid var(--line-soft)}
.proc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pnum{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.proc-head .lbl{font-size:15.5px;font-weight:700}
.risk{font-size:11.5px;color:var(--ok);background:var(--tint-ok);border-radius:5px;padding:1px 7px;font-weight:600}

/* keycaps */
.keys{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:10px 0 2px}
.kc{display:inline-flex;align-items:center;gap:4px;background:var(--key-bg);border:1px solid var(--key-line);
  border-bottom-width:3px;border-radius:6px;padding:4px 9px;font-size:13.5px;font-weight:600;
  font-family:ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;white-space:nowrap}
.kc.power{color:#fff;background:var(--accent);border-color:var(--accent);
  border-bottom-color:rgba(0,0,0,.35);font-family:inherit}
.kc.vol{font-family:inherit}
.plus{color:var(--fg-dim);font-size:13px}
.pin{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;color:var(--accent);
  background:var(--tint-danger);border:1px dashed var(--accent);border-radius:999px;padding:3px 11px}

/* timer button */
.timer-btn{margin-top:10px;display:inline-flex;align-items:center;gap:7px;background:var(--accent);
  color:#fff;border:0;border-radius:9px;padding:9px 15px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit}
.timer-btn:active{opacity:.85}
.timer-hint{font-size:12px;color:var(--fg-dim);margin-top:5px}

/* steps */
.steps{list-style:none;counter-reset:s;margin:10px 0 0}
.steps li{counter-increment:s;position:relative;padding:3px 0 3px 26px;font-size:14px;color:var(--fg)}
.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:18px;height:18px;
  border-radius:50%;border:1.5px solid var(--line);color:var(--fg-dim);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;background:var(--card)}

/* success / notes / cautions */
.block{border-radius:9px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.block .bt{font-size:12px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:5px;margin-bottom:3px}
.block ul{list-style:none}
.block li{position:relative;padding-left:13px;margin-top:2px}
.block li::before{content:"·";position:absolute;left:3px;font-weight:700}
.succ{background:var(--tint-ok);border:1px solid transparent;border-left:4px solid var(--ok);
  font-size:14.5px;font-weight:600;color:var(--fg)}
.succ .bt{color:var(--ok);font-weight:800}
.caut{background:var(--tint-danger);border-left:4px solid var(--accent);color:var(--fg)}
.caut .bt{color:var(--accent)}
.note{background:var(--tint-note);border-left:4px solid var(--line);color:var(--fg-soft)}
.note .bt{color:var(--fg-dim)}

/* figures */
.figs{margin-top:12px}
.fig{background:var(--tint-note);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px}
.fig .cap{font-size:12px;color:var(--fg-dim);margin-bottom:6px}
.fig .svgscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.fig svg{width:100%;height:auto;display:block;color:var(--fg)}
.fig .swipe{font-size:11px;color:var(--fg-dim);text-align:center;margin-top:5px}
.fig .ph{font-size:12px;color:var(--fg-dim);text-align:center;padding:14px 0}
details.schem{margin-top:8px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
details.schem > summary{cursor:pointer;font-size:13px;color:var(--fg-soft);padding:9px 12px;list-style:none}
details.schem > summary::-webkit-details-marker{display:none}
details.schem > summary::before{content:"▸ ";color:var(--fg-dim)}
details.schem[open] > summary::before{content:"▾ "}
details.schem .fig{margin:0 10px 10px}

/* lookup call-to-action */
.lookup{border:2px solid var(--accent);background:var(--tint-danger);border-radius:10px;padding:12px;margin-top:10px}
.lookup .lt{font-size:14px;font-weight:800;color:var(--accent);display:flex;gap:6px;align-items:flex-start}
.lookup .lw{font-size:13px;color:var(--fg-soft);margin-top:4px}
.lookup .path{margin-top:8px;background:var(--card);border-radius:7px;padding:8px 10px;font-size:12.5px;
  color:var(--fg);line-height:1.9;word-break:break-word}
.lookup .path b{color:var(--accent)}
.lookup a.go{display:inline-block;margin-top:8px;background:var(--accent);color:#fff;text-decoration:none;
  border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:700}
.lookup a.go.alt{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-left:6px}

/* brand accordion */
details.brand{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-top:8px}
details.brand > summary{cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px;list-style:none}
details.brand > summary::-webkit-details-marker{display:none}
details.brand > summary .bn{font-size:16px;font-weight:700}
details.brand > summary .bm{font-size:12px;color:var(--fg-dim);margin-top:1px}
details.brand > summary .arw{margin-left:auto;color:var(--fg-dim);font-size:12px;transition:transform .15s}
details.brand[open] > summary .arw{transform:rotate(90deg)}
details.brand[open] > summary{border-bottom:1px solid var(--line-soft)}
.blogo{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--tint-note);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.bbody{padding:0 0 4px}
.brand-note{margin:12px 14px 0}

/* blink codes */
.blink{margin:12px 14px 14px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.blink .bh{background:var(--tint-note);padding:8px 12px;font-size:13px;font-weight:700}
.blink table{width:100%;border-collapse:collapse;font-size:13.5px}
.blink td{padding:7px 12px;border-top:1px solid var(--line-soft);vertical-align:top}
.blink td.n{white-space:nowrap;color:var(--accent);font-weight:700;width:1%}

/* source */
.src{margin:12px 14px 14px;font-size:12px;color:var(--fg-dim);word-break:break-all}
.src a{color:var(--fg-soft)}

/* stop conditions */
.stop{background:var(--tint-danger);border:2px solid var(--accent);border-radius:var(--radius);padding:14px}
.stop h3{font-size:16px;color:var(--accent);display:flex;align-items:center;gap:7px}
.stop p{font-size:13px;color:var(--fg-soft);margin:3px 0 8px}
.stop ul{list-style:none}
.stop li{position:relative;padding:5px 0 5px 24px;font-size:14px;font-weight:600;border-top:1px solid rgba(179,58,34,.18)}
.stop li::before{content:"✋";position:absolute;left:0;top:5px;font-size:13px}

/* footer + misc */
footer{margin-top:22px;font-size:12px;color:var(--fg-dim);text-align:center;line-height:2}
footer a{color:var(--fg-soft)}
.empty{text-align:center;color:var(--fg-dim);font-size:14px;padding:26px 0;display:none}
.hidden{display:none !important}
mark{background:rgba(179,58,34,.18);color:inherit;border-radius:3px;padding:0 1px}

/* timer overlay */
.tmask{position:fixed;inset:0;background:rgba(10,12,16,.88);z-index:100;display:none;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.tmask.on{display:flex}
.tpanel{background:var(--card);border-radius:16px;padding:26px 20px 20px;text-align:center;width:100%;max-width:330px}
.tpanel .tl{font-size:14px;color:var(--fg-soft)}
.tpanel .tnum{font-size:76px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent);margin:6px 0}
.tpanel .tsub{font-size:15px;font-weight:700}
.tpanel .tsig{font-size:13px;color:var(--fg-soft);margin-top:10px;background:var(--tint-ok);
  border-radius:8px;padding:9px 11px;text-align:left}
.tpanel .tbtns{display:flex;gap:8px;margin-top:16px}
.tpanel button{flex:1;border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit}
.tpanel .close{background:var(--tint-note);color:var(--fg)}
.tpanel .again{background:var(--accent);color:#fff}
.tpanel.done .tnum{color:var(--ok)}
.ring{width:100%;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.ring i{display:block;height:100%;background:var(--accent);width:100%}

@media print{
  .searchwrap,.chips,.tmask,.hero .home,footer .noprint{display:none !important}
  body{background:#fff;font-size:12px}
  .card,details.brand,.tri{break-inside:avoid;border-color:#ccc}
  details.brand > summary .arw{display:none}
  .hero{background:none;color:#000;border-bottom:2px solid #000}
  .hero .scope{color:#444}
  .fig .svgscroll{overflow:visible}
  .fig svg{min-width:0 !important}
  .fig .swipe{display:none}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <a class="home" href="../index.html">← 0xc.in</a>
    <h1 id="mTitle">笔记本黑屏 · 放电与复位速查</h1>
    <p class="scope" id="mScope">加载中…</p>
  </div>
</header>

<div class="searchwrap">
  <div class="in">
    <div class="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var DATA=null, svgCache={}, svgSeq=0, ASSET={};

/* 品牌搜索别名：只影响搜索命中，不参与内容渲染 */
var ALIAS={
  hp:'惠普 hp huipu elitebook probook pavilion victus omen 暗影精灵 光影精灵 星 战66 大写锁定灯 大小写灯 caps lock numlock 闪码 闪烁 蜂鸣 滴滴声 post 错误码',
  dell:'戴尔 dell daier latitude xps inspiron precision 灵越 成就 外星人 alienware bist',
  lenovo:'联想 lenovo lianxiang thinkpad ideapad 小新 拯救者 昭阳 扬天 novo 复位孔 针孔 回形针',
  asus:'华硕 asus huashuo vivobook zenbook tuf rog 天选 无畏 灵耀 玩家国度',
  acer:'宏碁 宏基 acer aspire nitro predator extensa travelmate 暗影骑士 蜂鸟 掠夺者',
  msi:'微星 msi weixing stealth raider katana ge gs 冲锋坦克 绝影 泰坦',
  surface:'微软 微软平板 microsoft surface pro laptop book go studio',
  apple:'苹果 apple mac macbook air pro imac smc m1 m2 m3 m4 t2 intel 芯片 pingguo',
  'huawei-honor':'华为 荣耀 huawei honor matebook magicbook 擎云',
  other:'其他 三星 samsung 技嘉 gigabyte 雷蛇 razer 机械革命 雷神 神舟 火影 未知品牌 通用'
};
var LOGO={hp:'HP',dell:'DE',lenovo:'LE',asus:'AS',acer:'AC',msi:'MS',surface:'MS',apple:'',
  'huawei-honor':'HW',other:'···'};

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().replace(/[\s+\-_·、,，.。:：/\\（）()]/g,'');}
function subseq(hay,needle){
  var i=0;
  for(var j=0;j<hay.length&&i<needle.length;j++){ if(hay[j]===needle[i]) i++; }
  return i===needle.length;
}
function matches(hay,terms,loose){
  return terms.every(function(t){
    return hay.indexOf(t)>-1 || (loose && subseq(hay,t));
  });
}
function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}

/* ---------- keycaps ---------- */
function keysHtml(keys){
  if(!keys||!keys.length) return '';
  var parts=keys.map(function(k){
    if(k==='POWER') return '<span class="kc power">⏻ 电源键</span>';
    if(k==='VOLUP') return '<span class="kc vol">🔊 音量 +</span>';
    if(k==='WIN')   return '<span class="kc">⊞ Win</span>';
    if(k==='PINHOLE') return '<span class="pin">📎 机身针孔 · 用回形针</span>';
    return '<span class="kc">'+esc(k)+'</span>';
  });
  var html='';
  for(var i=0;i<parts.length;i++){
    if(i) html+='<span class="plus">+</span>';
    html+=parts[i];
  }
  return '<div class="keys">'+html+'</div>';
}

/* ---------- blocks ---------- */
function listBlock(cls,title,items){
  if(!items||!items.length) return '';
  var body = items.length===1 ? '<div>'+esc(items[0])+'</div>'
    : '<ul>'+items.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
  return '<div class="block '+cls.c+'"><div class="bt">'+cls.i+' '+title+'</div>'+body+'</div>';
}
var C_CAUT={c:'caut',i:'⚠️'}, C_NOTE={c:'note',i:'ℹ️'};

function successHtml(sig){
  if(!sig) return '';
  return '<div class="block succ"><div class="bt">✅ 成功的表现 · 看到这个才算成了</div><div>'+esc(sig)+'</div></div>';
}

/* ---------- figures ---------- */
/* JSON 里少数 note 是写给做页面的人看的，不展示给用户 */
function isBuildNote(s){return /页面上|条目顶部|复用同一个文件|放在.{0,6}条目|用 ?CSS|不必找图|不需要配图/.test(s||'');}
function assetTitle(file){return (ASSET[file]&&ASSET[file].title)||'位置示意';}

function figure(file,cap){
  return '<div class="fig"><div class="cap">'+esc(cap)+'</div>'+
         '<div class="svgslot" data-src="'+esc(file)+'"><div class="ph">图示加载中…</div></div></div>';
}
function imageHtml(img){
  if(!img) return '';
  var h='<div class="figs">';
  if(img.also) h+=figure(img.also,'先分清是哪个孔 — 插错孔可能扎破扬声器');
  if(img.per_model){
    h+='<div class="lookup">'+
       '<div class="lt"><span>⚠️</span><span>先查你自己的型号，别照着示意图捅</span></div>'+
       '<div class="lw">针孔位置每个型号都不一样，下面的线稿只是示意。按这个路径能查到你这台机器的官方标注图：</div>'+
       '<div class="path">'+esc(img.lookup_path||'到品牌官网支持页，输入你的机型或序列号，打开用户手册的机身概览页').replace(/→/g,'<b>→</b>')+'</div>';
    if(img.official_figure) h+='<a class="go" target="_blank" rel="noopener" href="'+esc(img.official_figure)+'">打开官方标注图 ↗</a>';
    if(img.official_figure_alt) h+='<a class="go alt" target="_blank" rel="noopener" href="'+esc(img.official_figure_alt)+'">备用页 ↗</a>';
    h+='</div>';
    if(img.asset){
      h+='<details class="schem"><summary>看示意位置（只是大概区域，不是你的型号）</summary>'+
         figure(img.asset,'示意图 · 位置因型号而异')+'</details>';
    }
  } else if(img.asset){
    h+=figure(img.asset,assetTitle(img.asset));
  }
  if(img.note&&!isBuildNote(img.note))
    h+='<div class="block note"><div class="bt">ℹ️ 看图时注意</div><div>'+esc(img.note)+'</div></div>';
  h+='</div>';
  return h;
}

/* ---------- procedure ---------- */
function procHtml(p,idx){
  var h='<div class="proc"><div class="proc-head">';
  if(idx) h+='<span class="pnum">'+idx+'</span>';
  h+='<span class="lbl">'+esc(p.label)+'</span>';
  if(p.risk) h+='<span class="risk">'+esc(p.risk)+'</span>';
  h+='</div>';
  h+=keysHtml(p.keys);
  if(p.hold_seconds){
    h+='<button class="timer-btn" data-sec="'+p.hold_seconds+'" data-label="'+esc(p.label)+
       '" data-sig="'+esc(p.success_signal||'')+'">⏱ 点我倒计时 '+p.hold_seconds+' 秒</button>'+
       '<div class="timer-hint">长按时很容易提前松手，让它替你数</div>';
  }
  if(p.steps&&p.steps.length){
    h+='<ol class="steps">'+p.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol>';
  }
  h+=successHtml(p.success_signal);
  h+=listBlock(C_CAUT,'注意 · 做错会出事',p.cautions);
  h+=listBlock(C_NOTE,'补充说明',p.notes);
  h+=imageHtml(p.image);
  h+='</div>';
  return h;
}

/* ---------- render sections ---------- */
function renderMeta(m){
  document.getElementById('mTitle').textContent=m.title;
  document.getElementById('mScope').textContent=m.scope;
  document.title=m.title+' - 0xc.in';
  document.getElementById('myth').innerHTML=
    '<b>先说清楚：这多半不是「静电」</b><p>'+esc(m.note)+'</p>';
  document.getElementById('metaLine').textContent='资料更新：'+m.updated+' · '+m.scope;
}

function renderTriage(list){
  document.getElementById('triage').innerHTML=list.map(function(t){
    var oos=/不是本手册范围/.test(t.action);
    return '<div class="tri'+(oos?' oos':'')+'" data-k="'+esc(norm([t.symptom,t.action,t.detail].join(' ')))+'">'+
      '<div class="sym"><span class="dot"></span><span>'+esc(t.symptom)+'</span></div>'+
      '<div class="act">'+esc(t.action)+'</div>'+
      '<div class="det">'+esc(t.detail)+'</div></div>';
  }).join('');
}

function renderUniversal(u){
  var c=document.getElementById('universal');
  c.innerHTML=procHtml(u,0);
}

function brandSearchText(b){
  var bits=[b.name,b.models,ALIAS[b.id]||''];
  (b.procedures||[]).forEach(function(p){
    bits.push(p.label);
    (p.keys||[]).forEach(function(k){bits.push(k==='POWER'?'电源键 POWER':k==='PINHOLE'?'针孔 回形针 PINHOLE':k==='VOLUP'?'音量加 VOLUP':k==='WIN'?'Win Windows键':k);});
    (p.steps||[]).forEach(function(s){bits.push(s);});
    if(p.success_signal) bits.push(p.success_signal);
    (p.notes||[]).forEach(function(s){bits.push(s);});
    (p.cautions||[]).forEach(function(s){bits.push(s);});
  });
  (b.notes||[]).forEach(function(s){bits.push(s);});
  if(b.blink_codes){bits.push('闪码 闪烁 大写锁定灯 蜂鸣 '+b.blink_codes.indicator);
    (b.blink_codes.codes||[]).forEach(function(c){bits.push(c.count+'下 '+c.meaning);});}
  return norm(bits.join(' '));
}

function renderBrands(brands){
  var box=document.getElementById('brands');
  box.innerHTML=brands.map(function(b){
    var h='<details class="brand" id="b-'+esc(b.id)+'" data-id="'+esc(b.id)+'">'+
      '<summary><span class="blogo">'+esc(LOGO[b.id]||'PC')+'</span>'+
      '<span><span class="bn">'+esc(b.name)+'</span><br><span class="bm">'+esc(b.models||'')+'</span></span>'+
      '<span class="arw">▸</span></summary><div class="bbody">';
    if(b.image){
      h+='<div style="padding:0 14px">'+imageHtml(b.image)+'</div>';
    }
    if(b.notes&&b.notes.length) h+='<div class="brand-note">'+listBlock(C_CAUT,'这个品牌特别容易搞错',b.notes)+'</div>';
    (b.procedures||[]).forEach(function(p,i){h+=procHtml(p,i+1);});
    if(b.blink_codes){
      h+='<div class="blink"><div class="bh">闪码对照 · 数'+esc(b.blink_codes.indicator)+'闪几下</div><table><tbody>'+
        (b.blink_codes.codes||[]).map(function(c){
          return '<tr><td class="n">闪 '+esc(c.count)+' 下</td><td>'+esc(c.meaning)+'</td></tr>';
        }).join('')+'</tbody></table></div>';
    }
    if(b.source) h+='<div class="src">来源：<a target="_blank" rel="noopener" href="'+esc(b.source)+'">'+esc(b.source)+'</a></div>';
    h+='</div></details>';
    return h;
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('details.brand'),function(d,i){
    d.__text=brandSearchText(brands[i]);
    d.addEventListener('toggle',function(){ if(d.open) loadSvgs(d); });
  });
}

function renderChips(brands){
  var c=document.getElementById('chips');
  c.innerHTML=brands.map(function(b){
    var short=b.name.replace(/^[A-Za-z]+\s+/,'')||b.name;
    return '<button class="chip" data-id="'+esc(b.id)+'">'+esc(short)+'</button>';
  }).join('');
  c.addEventListener('click',function(e){
    var btn=e.target.closest('.chip'); if(!btn) return;
    var d=document.getElementById('b-'+btn.dataset.id);
    if(!d) return;
    document.getElementById('q').value='';
    applySearch('');
    Array.prototype.forEach.call(document.querySelectorAll('details.brand'),function(x){x.open=(x===d);});
    Array.prototype.forEach.call(c.querySelectorAll('.chip'),function(x){x.classList.toggle('on',x===btn);});
    loadSvgs(d);
    var y=d.getBoundingClientRect().top+window.pageYOffset-88;
    window.scrollTo({top:y,behavior:'smooth'});
    history.replaceState(null,'','#'+btn.dataset.id);
  });
}

function renderStop(list){
  document.getElementById('stop').innerHTML=
    '<h3>✋ 出现这些情况，别再试了，直接送修</h3>'+
    '<p>继续折腾只会把小毛病变成大毛病。</p><ul>'+
    list.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>';
}

/* ---------- inline svg (scoped styles) ---------- */
function scopeSvg(text,id){
  text=text.replace(/<svg\b/,'<svg id="'+id+'"');
  return text.replace(/<style>([\s\S]*?)<\/style>/,function(_,css){
    var out=css.replace(/(^|\})([^{}]+)\{/g,function(m,close,sel){
      var s=sel.split(',').map(function(x){
        x=x.trim(); if(!x) return x;
        return '#'+id+' '+x;
      }).join(',');
      return close+s+'{';
    });
    return '<style>'+out+'</style>';
  });
}
function loadSvgs(root){
  Array.prototype.forEach.call(root.querySelectorAll('.svgslot[data-src]'),function(slot){
    var src=slot.getAttribute('data-src');
    slot.removeAttribute('data-src');
    var put=function(txt){
      var id='sv'+(++svgSeq);
      slot.innerHTML='<div class="svgscroll">'+scopeSvg(txt,id)+'</div>';
      var svg=slot.querySelector('svg'), sc=slot.querySelector('.svgscroll');
      if(svg){
        /* 窄屏上线稿会被压到看不清字，给个最小宽度改成横向滚动 */
        var vb=(svg.getAttribute('viewBox')||'').split(/[\s,]+/);
        var w=parseFloat(vb[2])||720;
        svg.style.minWidth=Math.round(w*0.74)+'px';
        if(sc.scrollWidth>sc.clientWidth+4)
          slot.insertAdjacentHTML('beforeend','<div class="swipe">← 图比屏幕宽，左右滑动看全 →</div>');
      }
    };
    if(svgCache[src]){put(svgCache[src]);return;}
    fetch(src).then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function(t){svgCache[src]=t;put(t);})
     .catch(function(){slot.innerHTML='<div class="ph">图示暂时打不开，看上面的文字说明也够用</div>';});
  });
}

/* ---------- search ---------- */
function applySearch(raw){
  var terms=String(raw||'').trim().split(/\s+/).map(norm).filter(Boolean);
  var box=document.getElementById('brands');
  var items=box.querySelectorAll('details.brand');
  var tris=document.querySelectorAll('.tri');
  var loose=false;
  if(terms.length){
    var strict=0;
    Array.prototype.forEach.call(items,function(d){if(matches(d.__text,terms,false))strict++;});
    Array.prototype.forEach.call(tris,function(x){if(matches(x.getAttribute('data-k')||'',terms,false))strict++;});
    loose=(strict===0);   /* 精确没命中时放宽成「按顺序含这几个字」 */
  }
  var hit=0;
  Array.prototype.forEach.call(items,function(d){
    var ok=!terms.length||matches(d.__text,terms,loose);
    d.classList.toggle('hidden',!ok);
    if(ok){
      hit++;
      if(terms.length){d.open=true;loadSvgs(d);}
    }
  });
  var searching=terms.length>0;
  var triHit=0;
  Array.prototype.forEach.call(tris,function(x){
    var k=x.getAttribute('data-k')||'';
    var ok=!searching||matches(k,terms,loose);
    x.classList.toggle('hidden',!ok);
    if(ok) triHit++;
  });
  document.getElementById('triageSec').classList.toggle('hidden',searching&&triHit===0);
  document.querySelector('#triageSec .sec-title').textContent=
    searching?'症状对照 · 命中的这条':'第 1 步 · 先对号入座';
  document.getElementById('empty').style.display=(searching&&hit===0&&triHit===0)?'block':'none';
  document.getElementById('stopSec').classList.toggle('hidden',searching);
  document.getElementById('myth').classList.toggle('hidden',searching);
  document.getElementById('clearBtn').style.display=searching?'block':'none';
  if(!searching){
    Array.prototype.forEach.call(items,function(d){d.open=false;});
    Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(x){x.classList.remove('on');});
  }
  document.querySelector('#uniSec .sec-title').textContent=
    searching?'通用放电 · 不管哪个品牌都先做':'第 2 步 · 所有品牌都先做这个';
}

/* ---------- timer ---------- */
var tState={id:null,left:0,total:0};
function beep(){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    var ctx=new Ctx();
    [0,0.25,0.5].forEach(function(off){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.3,ctx.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+off+0.18);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+off);o.stop(ctx.currentTime+off+0.2);
    });
  }catch(e){}
}
function openTimer(sec,label,sig){
  var m=document.getElementById('tmask'),p=document.getElementById('tpanel');
  p.classList.remove('done');
  document.getElementById('tLabel').textContent=label;
  document.getElementById('tSub').textContent='按住不放，别提前松手';
  var sigBox=document.getElementById('tSig');
  if(sig){sigBox.textContent='松手后看：'+sig;sigBox.style.display='block';}
  else{sigBox.style.display='none';}
  m.classList.add('on');
  startTimer(sec);
}
function startTimer(sec){
  clearInterval(tState.id);
  tState.total=sec;tState.left=sec;
  var p=document.getElementById('tpanel');
  p.classList.remove('done');
  document.getElementById('tSub').textContent='按住不放，别提前松手';
  paint();
  tState.id=setInterval(function(){
    tState.left--;
    if(tState.left<=0){
      clearInterval(tState.id);tState.left=0;paint();
      p.classList.add('done');
      document.getElementById('tNum').textContent='好了';
      document.getElementById('tSub').textContent='可以松手了';
      if(navigator.vibrate) try{navigator.vibrate([200,100,200]);}catch(e){}
      beep();
      return;
    }
    paint();
  },1000);
}
function paint(){
  document.getElementById('tNum').textContent=tState.left;
  document.getElementById('tRing').style.width=(tState.left/tState.total*100)+'%';
}
function closeTimer(){
  clearInterval(tState.id);
  document.getElementById('tmask').classList.remove('on');
}

/* ---------- boot ---------- */
function boot(d){
  DATA=d;
  (d.assets||[]).forEach(function(a){ASSET[a.file]=a;});
  renderMeta(d.meta);
  renderTriage(d.triage||[]);
  renderUniversal(d.universal);
  renderBrands(d.brands||[]);
  renderChips(d.brands||[]);
  renderStop(d.stop_conditions||[]);
  loadSvgs(document.getElementById('universal'));

  var q=document.getElementById('q');
  var t=null;
  q.addEventListener('input',function(){
    clearTimeout(t);
    t=setTimeout(function(){applySearch(q.value);},120);
  });
  document.getElementById('clearBtn').addEventListener('click',function(){
    q.value='';applySearch('');q.focus();
  });

  document.body.addEventListener('click',function(e){
    var b=e.target.closest('.timer-btn');
    if(b){openTimer(+b.dataset.sec,b.dataset.label,b.dataset.sig);}
  });
  document.getElementById('tClose').addEventListener('click',closeTimer);
  document.getElementById('tAgain').addEventListener('click',function(){startTimer(tState.total);});
  document.getElementById('tmask').addEventListener('click',function(e){
    if(e.target===document.getElementById('tmask')) closeTimer();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeTimer();});

  window.addEventListener('beforeprint',function(){
    Array.prototype.forEach.call(document.querySelectorAll('details'),function(x){
      x.open=true;loadSvgs(x);
    });
  });

  var hash=(location.hash||'').replace('#','');
  if(hash){
    var d2=document.getElementById('b-'+hash);
    if(d2){d2.open=true;loadSvgs(d2);setTimeout(function(){
      window.scrollTo({top:d2.getBoundingClientRect().top+window.pageYOffset-88});},60);}
  }
}

fetch('laptop-reset.json').then(function(r){
  if(!r.ok) throw new Error(r.status);
  return r.json();
}).then(boot).catch(function(){
  document.getElementById('mScope').textContent='数据加载失败，请刷新页面重试';
  document.getElementById('myth').innerHTML='<b>页面数据没能加载出来</b><p>刷新一下试试。如果你是直接用浏览器打开本地文件，请通过 http 访问（本页内容来自同目录的 laptop-reset.json）。</p>';
});
})();
</script>
