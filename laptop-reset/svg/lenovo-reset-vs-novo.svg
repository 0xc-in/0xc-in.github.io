<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="联想应急复位孔与 Novo 按钮的区别">
  <style>
    .ln{fill:none;stroke:currentColor;stroke-width:2}
    .thin{fill:none;stroke:currentColor;stroke-width:1.4;opacity:.5}
    .t{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:currentColor}
    .h{font-size:16px;font-weight:700}
    .lbl{font-size:15px;font-weight:700}
    .d{font-size:13px;opacity:.72}
    .ok{stroke:var(--accent,#B33A22);stroke-width:2.5;fill:none}
    .okf{fill:var(--accent,#B33A22)}
    .warn{fill:var(--warn,#8A6D1F)}
    .warns{stroke:var(--warn,#8A6D1F);stroke-width:2.5;fill:none}
    .div{stroke:currentColor;stroke-width:1;opacity:.25}
  </style>

  <text class="t h" x="0" y="18">联想机身上这两个小孔，功能完全不同</text>

  <!-- left: reset -->
  <g transform="translate(0,44)">
    <rect class="ln" x="0" y="0" width="300" height="110" rx="8"/>
    <text class="t d" x="150" y="24" text-anchor="middle" font-size="12">ThinkPad · 机身底部</text>
    <circle class="ok" cx="150" cy="62" r="8"/>
    <circle class="okf" cx="150" cy="62" r="2.8"/>
    <path class="thin" d="M120 62h-16M180 62h16"/>
  </g>
  <text class="t lbl" x="0" y="182" fill="var(--accent,#B33A22)">应急复位孔</text>
  <text class="t d" x="0" y="204">断开内置电池，放净电容残电</text>
  <text class="t d" x="0" y="224">回形针插入按住，接电后电源灯闪 3 下</text>
  <text class="t d" x="0" y="244">不动系统，不丢数据</text>
  <text class="t d" x="0" y="264">按住时长各方说法不一，按满 60 秒最保险</text>

  <line class="div" x1="360" y1="44" x2="360" y2="278"/>

  <!-- right: novo -->
  <g transform="translate(420,44)">
    <rect class="ln" x="0" y="0" width="300" height="110" rx="8"/>
    <text class="t d" x="150" y="24" text-anchor="middle" font-size="12">IdeaPad · 机身侧面或键盘旁</text>
    <circle class="warns" cx="150" cy="62" r="8"/>
    <path class="warns" d="M150 55.5v13M144 62h12" stroke-width="1.8"/>
    <path class="thin" d="M126 46l-6-6M174 46l6-6"/>
  </g>
  <text class="t lbl" x="420" y="182" fill="var(--warn,#8A6D1F)">Novo 按钮</text>
  <text class="t d" x="420" y="204">开机进入一键恢复菜单</text>
  <text class="t d" x="420" y="224">菜单项：正常启动 / BIOS / 启动项 / 系统恢复</text>
  <text class="t d" x="420" y="244">跟放电毫无关系</text>
  <text class="t d" x="420" y="264">误选「系统恢复」会清空数据</text>
</svg>
