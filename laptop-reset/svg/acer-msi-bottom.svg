<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="宏碁与微星底部电池重置孔的常见位置">
  <style>
    .ln{fill:none;stroke:currentColor;stroke-width:2}
    .thin{fill:none;stroke:currentColor;stroke-width:1.4;opacity:.5}
    .fillc{fill:currentColor}
    .t{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:currentColor}
    .h{font-size:16px;font-weight:700}
    .lbl{font-size:14px;font-weight:700}
    .d{font-size:12.5px;opacity:.72}
    .ok{stroke:var(--accent,#B33A22);stroke-width:2.5;fill:none}
    .okf{fill:var(--accent,#B33A22)}
    .okd{stroke:var(--accent,#B33A22);stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    .lead{stroke:var(--accent,#B33A22);stroke-width:1;opacity:.8;fill:none}
    .div{stroke:currentColor;stroke-width:1;opacity:.25}
  </style>

  <text class="t h" x="0" y="18">宏碁 / 微星 · 电池重置孔常见位置</text>
  <text class="t d" x="0" y="38">示意线稿，非具体型号。两家都把这个孔放在底部，但具体位置按机型查手册。</text>

  <!-- Acer -->
  <g transform="translate(0,60)">
    <text class="t lbl" x="0" y="0">Acer 宏碁</text>
    <rect class="ln" x="0" y="16" width="320" height="196" rx="12"/>
    <line class="thin" x1="0" y1="46" x2="320" y2="46"/>
    <text class="t d" x="160" y="39" text-anchor="middle" font-size="11">转轴一侧</text>
    <g class="thin">
      <rect x="40" y="60" width="86" height="34" rx="3"/>
      <path d="M50 64v26M62 64v26M74 64v26M86 64v26M98 64v26M110 64v26"/>
    </g>
    <g class="fillc" opacity=".7">
      <circle cx="52" cy="176" r="1.8"/><circle cx="64" cy="176" r="1.8"/><circle cx="76" cy="176" r="1.8"/><circle cx="88" cy="176" r="1.8"/>
      <circle cx="232" cy="176" r="1.8"/><circle cx="244" cy="176" r="1.8"/><circle cx="256" cy="176" r="1.8"/><circle cx="268" cy="176" r="1.8"/>
    </g>
    <g class="thin"><circle cx="20" cy="34" r="4"/><circle cx="300" cy="34" r="4"/><circle cx="20" cy="196" r="4"/><circle cx="300" cy="196" r="4"/></g>
    <rect class="okd" x="176" y="106" width="118" height="52" rx="8"/>
    <circle class="ok" cx="235" cy="132" r="7"/>
    <circle class="okf" cx="235" cy="132" r="2.5"/>
  </g>
  <text class="t lbl" x="0" y="292" fill="var(--accent,#B33A22)">电池重置针孔</text>
  <text class="t d" x="0" y="312">拔适配器 → 插针按住 4 秒 → 断电静置 5 分钟 → 接电开机</text>
  <text class="t d" x="0" y="330">孔旁常有一颗小指示灯</text>
  <text class="t d" x="0" y="348">操作时不能接着充电器</text>
  <text class="t d" x="0" y="366">部分新机型已取消该孔，找不到属正常，改用长按电源键</text>

  <line class="div" x1="368" y1="60" x2="368" y2="366"/>

  <!-- MSI -->
  <g transform="translate(400,60)">
    <text class="t lbl" x="0" y="0">MSI 微星</text>
    <rect class="ln" x="0" y="16" width="320" height="196" rx="12"/>
    <line class="thin" x1="0" y1="46" x2="320" y2="46"/>
    <text class="t d" x="160" y="39" text-anchor="middle" font-size="11">转轴一侧</text>
    <g class="thin">
      <rect x="44" y="58" width="96" height="36" rx="3"/>
      <path d="M54 62v28M66 62v28M78 62v28M90 62v28M102 62v28M114 62v28M126 62v28"/>
      <rect x="180" y="58" width="96" height="36" rx="3"/>
      <path d="M190 62v28M202 62v28M214 62v28M226 62v28M238 62v28M250 62v28M262 62v28"/>
    </g>
    <g class="thin"><circle cx="20" cy="34" r="4"/><circle cx="300" cy="34" r="4"/><circle cx="20" cy="196" r="4"/><circle cx="300" cy="196" r="4"/><circle cx="160" cy="200" r="4"/></g>
    <rect class="okd" x="102" y="118" width="118" height="52" rx="8"/>
    <circle class="ok" cx="161" cy="144" r="7"/>
    <circle class="okf" cx="161" cy="144" r="2.5"/>
  </g>
  <text class="t lbl" x="400" y="292" fill="var(--accent,#B33A22)">Battery Reset Hole</text>
  <text class="t d" x="400" y="312">关机拔电 → 插针按住 10 秒 → 接电开机</text>
  <text class="t d" x="400" y="330">手册里的用途说明：EC 固件升级后或系统死机时使用</text>
  <text class="t d" x="400" y="348">查法：msi.com → Support → 输入型号 → Manual</text>
  <text class="t d" x="400" y="366">下载 User Manual PDF，看第 2 章 Body Overview 标注图</text>
</svg>
