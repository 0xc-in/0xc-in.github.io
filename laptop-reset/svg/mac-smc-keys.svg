<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Mac SMC 复位的两代按键组合，区分左右修饰键">
  <style>
    .ln{fill:none;stroke:currentColor;stroke-width:1.6;opacity:.55}
    .t{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:currentColor}
    .h{font-size:16px;font-weight:700}
    .lbl{font-size:14px;font-weight:700}
    .d{font-size:12.5px;opacity:.72}
    .k{font-size:11px;fill:currentColor;opacity:.6}
    .hit{fill:var(--accent,#B33A22);opacity:.14;stroke:var(--accent,#B33A22);stroke-width:2}
    .hitt{font-size:11px;fill:var(--accent,#B33A22);font-weight:700}
  </style>

  <text class="t h" x="0" y="18">Mac SMC 复位 · 两代的按键位置不一样</text>
  <text class="t d" x="0" y="38">这是全手册唯一需要配键盘图的地方：修饰键左右两侧各有一个，按错的那一半完全无效。</text>

  <!-- Row A: T2 -->
  <text class="t lbl" x="0" y="76">Intel + T2（2018–2020）：左 Control ＋ 左 Option ＋ 右 Shift</text>
  <g transform="translate(0,88)">
    <!-- left cluster -->
    <rect class="hit" x="0" y="0" width="72" height="34" rx="5"/>
    <text class="t hitt" x="36" y="21" text-anchor="middle">左 Control</text>
    <rect class="hit" x="78" y="0" width="66" height="34" rx="5"/>
    <text class="t hitt" x="111" y="21" text-anchor="middle">左 Option</text>
    <rect class="ln" x="150" y="0" width="66" height="34" rx="5"/>
    <text class="t k" x="183" y="21" text-anchor="middle">左 Command</text>
    <rect class="ln" x="222" y="0" width="176" height="34" rx="5"/>
    <text class="t k" x="310" y="21" text-anchor="middle">空格</text>
    <rect class="ln" x="404" y="0" width="66" height="34" rx="5"/>
    <text class="t k" x="437" y="21" text-anchor="middle">右 Command</text>
    <rect class="ln" x="476" y="0" width="66" height="34" rx="5"/>
    <text class="t k" x="509" y="21" text-anchor="middle">右 Option</text>
    <!-- right shift sits a row up; draw it offset -->
    <rect class="hit" x="548" y="-42" width="96" height="34" rx="5"/>
    <text class="t hitt" x="596" y="-21" text-anchor="middle">右 Shift</text>
    <rect class="ln" x="0" y="-42" width="96" height="34" rx="5"/>
    <text class="t k" x="48" y="-21" text-anchor="middle">左 Shift</text>
  </g>
  <text class="t d" x="0" y="152">先按住这三个 7 秒（机器可能自己开机，正常），保持不放再加电源键，四键一起再按 7 秒。</text>

  <!-- Row B: pre-T2 -->
  <text class="t lbl" x="0" y="196">Intel 无 T2（2017 及更早）：左 Shift ＋ 左 Control ＋ 左 Option ＋ 电源键</text>
  <g transform="translate(0,250)">
    <rect class="hit" x="0" y="-42" width="96" height="34" rx="5"/>
    <text class="t hitt" x="48" y="-21" text-anchor="middle">左 Shift</text>
    <rect class="ln" x="548" y="-42" width="96" height="34" rx="5"/>
    <text class="t k" x="596" y="-21" text-anchor="middle">右 Shift</text>

    <rect class="hit" x="0" y="0" width="72" height="34" rx="5"/>
    <text class="t hitt" x="36" y="21" text-anchor="middle">左 Control</text>
    <rect class="hit" x="78" y="0" width="66" height="34" rx="5"/>
    <text class="t hitt" x="111" y="21" text-anchor="middle">左 Option</text>
    <rect class="ln" x="150" y="0" width="66" height="34" rx="5"/>
    <text class="t k" x="183" y="21" text-anchor="middle">左 Command</text>
    <rect class="ln" x="222" y="0" width="176" height="34" rx="5"/>
    <text class="t k" x="310" y="21" text-anchor="middle">空格</text>
    <rect class="ln" x="404" y="0" width="66" height="34" rx="5"/>
    <text class="t k" x="437" y="21" text-anchor="middle">右 Command</text>
    <rect class="ln" x="476" y="0" width="66" height="34" rx="5"/>
    <text class="t k" x="509" y="21" text-anchor="middle">右 Option</text>
  </g>
  <text class="t d" x="0" y="310">三个键全在左侧，加电源键一起按满 10 秒，松开后开机。</text>
  <text class="t d" x="0" y="330">M 系列（2020 年后）没有 SMC，上面两套都无效，只要彻底关机等满 30 秒。</text>
</svg>
